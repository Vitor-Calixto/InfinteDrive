<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>
    // Mata Service Workers fósseis (do projeto antigo) que servem HTML velho sem falar com o servidor.
    if ('serviceWorker' in navigator) { navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); }).catch(function () {}); }
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>Deploy Center — Drive Spotify</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231DB954'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- AUTH -->
  <div id="authScreen" class="sp-authscreen" hidden>
    <div class="sp-authcard">
      <div class="sp-logo big"><span class="sp-logo-dot"></span> Deploy Center</div>
      <div id="authLogin">
        <input id="u_email" class="inp" placeholder="E-mail" autocomplete="email" />
        <input id="u_pass" class="inp" type="password" placeholder="Senha" autocomplete="current-password" />
        <button onclick="Auth.login()" class="btn-big">Entrar</button>
        <div class="flex gap-2 mt-2 text-xs"><span class="text-zinc-500">ou</span></div>
        <div id="googleWrap" class="mt-2"><div id="googleBtn"></div></div>
        <div class="flex gap-2 mt-2 text-xs">
          <button onclick="Auth.show('register')" class="sp-link">Criar conta</button>
          <button onclick="Auth.show('forgot')" class="sp-link">Esqueci a senha</button>
        </div>
      </div>
      <div id="authRegister" hidden>
        <input id="u_name" class="inp" placeholder="Nome" />
        <input id="r_email" class="inp" placeholder="E-mail" />
        <input id="r_pass" class="inp" type="password" placeholder="Senha (8+ caracteres)" />
        <button onclick="Auth.register()" class="btn-big">Cadastrar</button>
        <div class="mt-2 text-xs"><button onclick="Auth.show('login')" class="sp-link">Voltar ao login</button></div>
      </div>
      <div id="authForgot" hidden>
        <input id="f_email" class="inp" placeholder="Seu e-mail" />
        <button onclick="Auth.forgot()" class="btn-big">Enviar link</button>
        <div class="mt-2 text-xs"><button onclick="Auth.show('login')" class="sp-link">Voltar ao login</button></div>
        <div id="forgotState" class="text-xs mt-2 text-zinc-400"></div>
      </div>
      <div id="auth2fa" hidden>
        <p class="hint">Código de 6 dígitos do app autenticador (ou um código reserva).</p>
        <input id="tfa_code" class="inp" inputmode="numeric" maxlength="12" placeholder="123456" autocomplete="one-time-code" />
        <button onclick="Auth.verify2fa()" class="btn-big">Verificar</button>
        <div class="mt-2 text-xs"><button onclick="Auth.show('login')" class="sp-link">Voltar</button></div>
      </div>
    </div>
  </div>

  <!-- SHELL -->
  <div class="sp-shell" id="appShell">
    <!-- Aba fina na borda esquerda: aparece só com a barra escondida, 1 clique traz de volta -->
    <button id="sideReopen" onclick="Shell.toggleSidebar(event)" title="Mostrar biblioteca">›</button>
    <!-- SIDEBAR ÚNICA. Só existe esta. Nenhum outro painel lateral fullscreen. -->
    <aside id="sidebar" class="sp-side" aria-label="Biblioteca">
      <!-- HAMBURGER DENTRO DA BARRA: visível sempre com ela aberta; fechada usa a aba › -->
      <button id="navToggle" class="sp-navtoggle" onclick="Shell.toggleSidebar(event)" title="Biblioteca — abrir / recolher" aria-label="Abrir ou recolher biblioteca"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="2" y1="4" x2="16" y2="4"/><line x1="2" y1="9" x2="16" y2="9"/><line x1="2" y1="14" x2="16" y2="14"/></svg></button>
      <div class="sp-side-card nav-card">
        <div class="sp-logo"><span class="sp-logo-dot"></span> <span class="side-label">Deploy Center</span></div>
        <nav class="sp-nav">
          <button class="sp-nav-btn active" data-view="drive" onclick="Shell.show('drive')">🏠 <span class="side-label">Início</span></button>
          <button class="sp-nav-btn" onclick="Search.focus()"><span class="nav-icon">🔍</span> <span class="side-label">Buscar</span></button>
        </nav>
      </div>
      <div class="sp-side-card lib-card">
        <div class="sp-lib-header">
          <div class="sp-lib-title">📚 <span class="side-label">Sua Biblioteca</span></div>
          <button class="sp-icon-btn" onclick="Shell.toggleCriar(event)" title="Criar">＋</button>
        </div>
        <div id="criarMenu" class="sp-menu" hidden>
          <button onclick="Playlists.create()">📁 Nova playlist</button>
          <button onclick="Profiles.create()">👤 Novo perfil</button>
          <button onclick="Upload.pick()">⬆ Enviar arquivo</button>
        </div>
        <nav class="sp-pills-nav" id="kindNav">
          <button class="sp-pill active" data-kind="all" onclick="Drive.filterKind('all')">Todas</button>
          <button class="sp-pill" data-kind="image" onclick="Drive.filterKind('image')">🖼 Fotos</button>
          <button class="sp-pill" data-kind="audio" onclick="Drive.filterKind('audio')">🎧 Músicas</button>
          <button class="sp-pill" data-kind="video" onclick="Drive.filterKind('video')">🎬 Vídeos</button>
        </nav>
        <div class="sp-lib-scroll">
          <nav class="sp-nav" id="playNav"></nav>
          <div class="sp-menu-sep"></div>
          <nav class="sp-nav" id="systemNav">
            <button class="sp-nav-btn" data-view="system" onclick="Shell.show('system')">📊 <span class="side-label">Uso</span></button>
            <button class="sp-nav-btn" data-view="planos" onclick="Shell.show('planos')">💎 <span class="side-label">Planos</span></button>
            <button class="sp-nav-btn" data-view="import" onclick="Shell.show('import')">📥 <span class="side-label">Importar</span></button>
            <button class="sp-nav-btn" data-view="trash" onclick="Shell.show('trash')">🗑 <span class="side-label">Lixeira</span></button>
            <button class="sp-nav-btn" data-view="vault" onclick="Shell.show('vault')">🔒 <span class="side-label">Cofre</span></button>
            <button class="sp-nav-btn" data-view="admin" onclick="Shell.show('admin')">⚙ <span class="side-label">Admin</span></button>
          </nav>
        </div>
        <div class="sp-side-foot">
          <div class="sp-quota-mini">
            <div class="flex justify-between text-xs text-zinc-400"><span>Espaço</span><span id="qUseMini">–</span></div>
            <div class="sp-bar"><div id="qBarMini" style="width:0%"></div></div>
          </div>
          <div class="sp-foot-row">
            <button class="sp-foot-btn" onclick="Shell.show('system')" title="Minha conta e uso">⚙ Conta</button>
            <button class="sp-foot-btn" onclick="Shell.show('planos')" title="Ver planos">💎 Planos</button>
            <button class="sp-foot-btn" onclick="Auth.logout()" title="Sair">↩ Sair</button>
          </div>
          <div class="sp-ver">Deploy Center v10</div>
        </div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="sp-main" id="main">
      <header class="sp-topbar">
        <div class="sp-topbar-left">
          <input id="search" class="sp-search" placeholder="O que você quer ouvir ou buscar? 🔍" oninput="Search.onInput(this.value)" />
        </div>
      </header>
      <div id="viewHost"></div>
    </main>
  </div>

  <nav id="mobileNav">
    <button class="sp-nav-btn active" data-view="drive" onclick="Shell.show('drive')">🏠<span>Início</span></button>
    <button class="sp-nav-btn" data-view="system" onclick="Shell.show('system')">📊<span>Uso</span></button>
    <button class="sp-nav-btn" data-view="planos" onclick="Shell.show('planos')">💎<span>Planos</span></button>
    <button class="sp-nav-btn" data-view="import" onclick="Shell.show('import')">📥<span>Trazer</span></button>
    <button class="sp-nav-btn" data-view="trash" onclick="Shell.show('trash')">🗑<span>Lixeira</span></button>
  </nav>

  <footer id="player" class="sp-player" hidden>
    <div class="sp-player-left">
      <img id="pCover" class="sp-p-cover" alt="" />
      <div class="sp-p-meta"><div id="pTitle" class="sp-p-title">–</div><div id="pSub" class="sp-p-sub">–</div></div>
    </div>
    <div class="sp-player-center">
      <div class="sp-p-btns">
        <button onclick="Player.prev()" title="Anterior">⏮</button>
        <button id="pToggle" onclick="Player.toggle()" class="sp-play-btn" title="Play/Pause">⏸</button>
        <button onclick="Player.next()" title="Próxima">⏭</button>
      </div>
      <audio id="audio" class="sp-p-audio" controls preload="metadata"></audio>
    </div>
    <div class="sp-player-right"><button onclick="Player.close()" class="sp-p-close" title="Fechar">✕</button></div>
  </footer>

  <div id="modal" class="sp-modal" hidden onclick="if(event.target===this)Share.closeModal()">
    <button class="sp-modal-x" onclick="Share.closeModal()">✕</button>
    <div id="modalBody" class="sp-modal-body"></div>
    <div id="modalCap" class="sp-modal-cap"></div>
    <div id="shareRow" class="sp-share-row">
      <span class="text-xs text-zinc-400">Compartilhar:</span>
      <button class="btn-ghost" onclick="Share.via('wa')">WhatsApp</button>
      <button class="btn-ghost" onclick="Share.via('copy')">Copiar link</button>
      <button class="btn-ghost" onclick="Share.via('native')">⋯ Mais</button>
    </div>
  </div>

  <div id="inputBox" class="sp-modal" hidden>
    <div class="sp-confirm"><div id="inputMsg" class="sp-confirm-msg"></div><input id="inputField" class="inp" />
      <div class="sp-confirm-row"><button id="inputNo" class="btn-ghost">Cancelar</button><button id="inputYes" class="btn">Salvar</button></div>
    </div>
  </div>
  <div id="confirmBox" class="sp-modal" hidden>
    <div class="sp-confirm"><div id="confirmMsg" class="sp-confirm-msg"></div>
      <div class="sp-confirm-row"><button id="confirmNo" class="btn-ghost">Cancelar</button><button id="confirmYes" class="btn">Confirmar</button></div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="modules/auth/auth.js"></script>
  <script src="modules/auth/twofa.js"></script>
  <script src="modules/drive/drive.js"></script>
  <script src="modules/playlists/playlists.js"></script>
  <script src="modules/player/player.js"></script>
  <script src="modules/search/search.js"></script>
  <script src="modules/upload/upload.js"></script>
  <script src="modules/download/download.js"></script>
  <script src="modules/share/share.js"></script>
  <script src="modules/vault/vault.js"></script>
  <script src="modules/profiles/profiles.js"></script>
  <script src="modules/trash/trash.js"></script>
  <script src="modules/system/system.js"></script>
  <script src="modules/import/import.js"></script>
  <script src="modules/admin/admin.js"></script>
  <script src="modules/planos/planos.js"></script>
  <script src="js/shell.js"></script>
</body>
</html>
