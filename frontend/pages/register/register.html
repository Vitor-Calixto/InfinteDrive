<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(function(rs){rs.forEach(function(r){r.unregister()})}).catch(function(){})}</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — Deploy Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%231DB954'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="register.css?v=1" />
</head>
<body>
  <main class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo"><span class="auth-dot"></span> Deploy Center</div>
      <h1>Criar conta</h1>
      <p class="auth-sub">A primeira conta vira admin.</p>
      <label class="fld">Nome
        <input id="name" type="text" placeholder="Seu nome" autocomplete="name" />
      </label>
      <label class="fld">E-mail
        <input id="email" type="email" placeholder="voce@email.com" autocomplete="email" />
      </label>
      <label class="fld">Senha (8+ caracteres)
        <input id="pass" type="password" placeholder="Escolha uma senha" autocomplete="new-password" />
      </label>
      <div id="err" class="auth-err" hidden></div>
      <button id="btn" class="btn-big" onclick="Register.go()">Cadastrar</button>
      <div class="auth-links">
        <a href="../login/login.html">Já tenho conta</a>
        <a href="../forgot/forgot.html">Esqueci a senha</a>
      </div>
      <details class="auth-api">
        <summary>Onde está o servidor?</summary>
        <input id="apiBase" placeholder="http://localhost:4000/api" />
      </details>
    </div>
  </main>
  <script src="register.js?v=1"></script>
</body>
</html>
