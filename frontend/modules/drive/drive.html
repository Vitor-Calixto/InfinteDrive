<h1 class="sp-greet" id="greet">Boa noite 🌙</h1>
<div id="dropzone" class="sp-drop">
  Arraste foto, música ou vídeo aqui — ou <label class="sp-link">clique para escolher<input id="filePick" type="file" multiple class="hidden" style="display:none" onchange="Upload.send(this.files)" /></label>
</div>
<div id="upStatus" class="text-xs mt-2 text-zinc-400"></div>
<div id="upBar" class="sp-progress" hidden><div id="upFill" style="width:0%"></div></div>
<div id="upQueue" class="upq" hidden></div>
<div id="procBanner" class="proc-banner" hidden></div>
<div id="addBanner" class="proc-banner" hidden></div>
<div id="foldersWrap">
  <div class="flex justify-between items-center mt-5 mb-2">
    <h2 class="sp-h2">📁 Pastas <span id="folderCount" class="text-xs text-zinc-400"></span></h2>
    <button onclick="Drive.folderNew()" class="btn-ghost">＋ Nova pasta</button>
  </div>
  <div id="foldersGrid" class="folder-grid"></div>
</div>
<div class="flex justify-between items-center mt-5 mb-2 drive-head">
  <h2 class="sp-h2">Seus arquivos <span id="fileCount" class="text-xs text-zinc-400"></span></h2>
  <div id="selBanner" class="proc-banner" hidden></div>
  <div class="flex gap-2">
    <div class="view-toggle">
      <button id="viewGridBtn" onclick="Drive.setView('grid')" title="Grade">▦</button>
      <button id="viewListBtn" onclick="Drive.setView('list')" title="Lista">☰</button>
    </div>
    <select id="sortSel" class="inp" style="width:auto;margin:0" onchange="Drive.setSort(this.value)">
      <option value="recent">Mais recentes</option>
      <option value="oldest">Mais antigos</option>
      <option value="az">Nome A–Z</option>
      <option value="za">Nome Z–A</option>
      <option value="biggest">Maiores</option>
      <option value="smallest">Menores</option>
    </select>
    <button onclick="Drive.selectMode()" class="btn-ghost">☑ Selecionar</button>
    <button onclick="DlQueue.start()" class="btn-ghost">⬇ Baixar lista</button>
    <button onclick="Drive.cleanBroken()" class="btn-ghost">🧹 Quebrados</button>
    <button onclick="Drive.cleanAll()" class="btn-ghost">🗑 Excluir tudo</button>
    <button onclick="Drive.refresh()" class="btn-ghost">Atualizar</button>
  </div>
</div>
<div id="dlQueue" class="upq" hidden></div>
<div id="filesGrid" class="sp-grid"><span class="text-zinc-500 text-xs">Carregando…</span></div>
<div id="detailModal" class="sp-modal" hidden onclick="if(event.target===this)Drive.closeDetail()">
  <div class="detail-card">
    <button class="sp-modal-x detail-x" onclick="Drive.closeDetail()">✕</button>
    <div class="detail-head">
      <div id="detailIcon" class="detail-icon">📄</div>
      <div><div id="detailName" class="detail-name">–</div><div id="detailType" class="detail-type">–</div></div>
    </div>
    <div id="detailPreview" class="detail-preview"></div>
    <div class="detail-stats">
      <div><span>Tamanho</span><b id="detailSize">–</b></div>
      <div><span>Guardado</span><b id="detailOrig">–</b></div>
      <div><span>Data</span><b id="detailDate">–</b></div>
    </div>
    <div class="flex gap-2 mt-2">
      <button id="detailDl" class="btn">⬇ Baixar</button>
      <button id="detailCopy" class="btn-ghost">🔗 Copiar link</button>
    </div>
  </div>
</div>
<div id="driveHotbar" class="drive-hotbar">
  <button onclick="Drive.selectMode()"><b>☑</b><span>Selecionar</span></button>
  <button onclick="DlQueue.start()"><b>⬇</b><span>Baixar</span></button>
  <button onclick="Drive.cleanAll()"><b>🗑</b><span>Excluir</span></button>
  <button onclick="Drive.refresh()"><b>⟳</b><span>Atualizar</span></button>
  <button onclick="document.getElementById('viewHost').scrollTop=0"><b>⬆</b><span>Topo</span></button>
</div>
